[project]
name = "vst-python"
version = "0.1.0"
description = "Vietnamese Stock Tracker - data fetching / ML microservice (vnstock)"
requires-python = ">=3.12"
dependencies = [
    "vnstock",
    "fastapi",
    "uvicorn[standard]",
    # numpy<2.4 hits "OverflowError: cannot convert longdouble infinity to integer" on
    # import under Python 3.14 on Windows (a numpy bug, fixed by 2.5.x). vnstock's own
    # dependency (vnstock-ezchart) declares numpy<2.3, but it's unused by this service
    # (we never touch vnstock's charting submodule) so overriding the floor here is safe.
    "numpy>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
