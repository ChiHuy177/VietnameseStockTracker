services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: vst-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vst}
      POSTGRES_USER: ${POSTGRES_USER:-vst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vst}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vst} -d ${POSTGRES_DB:-vst}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
