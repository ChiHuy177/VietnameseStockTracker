server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST API -> backend (same paths the Vite dev proxy forwards)
    location /api/ {
        proxy_pass http://be:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # STOMP over WebSocket for the real-time price board — needs the Upgrade headers,
    # otherwise the handshake fails and prices stop updating.
    location /ws {
        proxy_pass http://be:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback so client-side routes like /stocks/VNM work on refresh
    location / {
        try_files $uri $uri/ /index.html;
    }
}
