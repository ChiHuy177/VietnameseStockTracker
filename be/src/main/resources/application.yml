spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vst}
    username: ${DB_USER:vst}
    password: ${DB_PASSWORD:vst}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

vnstock:
  base-url: ${VNSTOCK_SERVICE_URL:http://localhost:8000}

resilience4j:
  retry:
    instances:
      vnstock:
        max-attempts: 3
        wait-duration: 500ms
  circuitbreaker:
    instances:
      vnstock:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
